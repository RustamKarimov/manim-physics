[CLI]
# The launcher explicitly supplies this file, so scenes in nested folders use it.
renderer = cairo
background_color = BLACK
# Final defaults. The launcher's preview profile overrides resolution and fps.
pixel_width = 1920
pixel_height = 1080
frame_rate = 30
# Screen coordinates span 14.222... units horizontally and 8 vertically.
# These are visual units, not metres; use axes.c2p() for physical coordinates.
frame_width = 14.222222222222221
frame_height = 8
format = mp4
write_to_movie = True
save_last_frame = False
save_pngs = False
preview = False
show_in_file_browser = False
save_sections = False
log_to_file = True
verbosity = INFO
# The launcher overrides media_dir with a lesson/unit/profile-specific path.
media_dir = ./build/manual
video_dir = {media_dir}/videos
images_dir = {media_dir}/images
tex_dir = {media_dir}/Tex
text_dir = {media_dir}/text
log_dir = {media_dir}/logs
partial_movie_dir = {video_dir}/partial_movie_files/{scene_name}
sections_dir = {video_dir}/sections/{scene_name}
